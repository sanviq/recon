<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recon — reconciliation report</title>
<style>
  /* Palette roles. Dark values are selected steps for the dark surface, not an
     automatic flip of the light ones. */
  :root {
    color-scheme: light;
    --surface:        #fcfcfb;
    --plane:          #f9f9f7;
    --ink:            #0b0b0b;
    --ink-2:          #52514e;
    --ink-muted:      #898781;
    --grid:           #e1e0d9;
    --axis:           #c3c2b7;
    --border:         rgba(11,11,11,0.10);

    /* Meter: one hue, fill darker than its own track (ordinal ramp, validated). */
    --meter-fill:     #2a78d6;
    --meter-track:    #86b6ef;
    --bar:            #2a78d6;

    /* The one two-way split this report is about: confirmed against the bank, or
       not. Blue/orange, checked with scripts/validate_palette.js against this
       surface — lightness band, chroma, contrast, and CVD separation all pass
       (worst adjacent ΔE 26.1 protan). It is a polarity, not a category list,
       which is why it gets its own pair and not a slot from a categorical ramp. */
    --series-matched: #2a78d6;
    --series-flagged: #c2551f;

    /* Status palette — fixed, never themed, never reused as a series color. */
    --sev-high:       #d03b3b;
    --sev-medium:     #ec835a;
    --sev-low:        #898781;
    --good:           #006300;

    --elev:           0 1px 2px rgba(11,11,11,0.05), 0 6px 16px -10px rgba(11,11,11,0.14);
    --topbar:         rgba(252,252,251,0.86);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      /* The card has to read as a card. The previous pair sat two points apart
         and the whole page collapsed into one flat black field. */
      --surface:      #1c1c1b;
      --plane:        #0a0a09;
      --ink:          #ffffff;
      --ink-2:        #c3c2b7;
      --ink-muted:    #8f8d86;
      --grid:         #2e2e2b;
      --axis:         #3d3d39;
      --border:       rgba(255,255,255,0.13);
      --meter-fill:   #3987e5;
      --meter-track:  #184f95;
      --bar:          #3987e5;
      /* Re-stepped for the dark surface, not flipped: the light-mode orange sits
         at L 0.72 here, outside the band, and washes out against #1c1c1b. */
      --series-matched: #3987e5;
      --series-flagged: #d9663a;
      --sev-high:     #d03b3b;
      --sev-medium:   #ec835a;
      --sev-low:      #898781;
      --good:         #0ca30c;
      --elev:         0 1px 2px rgba(0,0,0,0.5), 0 8px 22px -14px rgba(0,0,0,0.9);
      --topbar:       rgba(10,10,9,0.82);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* --- shell: a fixed rail beside a scrolling report ---------------------- */
  .shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); align-items: start; }
  .wrap { max-width: 1220px; margin: 0 auto; padding: 0 26px 64px; }

  .rail {
    position: sticky; top: 0; height: 100vh; z-index: 20;
    display: flex; flex-direction: column; gap: 4px;
    padding: 20px 14px 16px;
    background: var(--surface); border-right: 1px solid var(--border);
  }

  /* The mark is the relational join operator: two triangles meeting point to
     point. That is not decoration — a join across three sources is literally the
     whole program, and the two halves are the same two colours the report uses
     for confirmed and flagged. */
  .brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 20px; }
  .brand svg { display: block; flex: none; }
  .wordmark { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .wordmark b {
    font-size: 17px; font-weight: 750; letter-spacing: 0.14em;
    line-height: 1; color: var(--ink);
  }
  .wordmark em {
    font-style: normal; font-size: 10.5px; letter-spacing: 0.055em;
    color: var(--ink-muted); text-transform: uppercase; white-space: nowrap;
  }

  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    color: var(--ink-2); text-decoration: none; font-size: 13.5px;
    border: 1px solid transparent;
  }
  .nav a .n {
    display: grid; place-items: center; width: 18px; height: 18px; border-radius: 5px;
    background: var(--plane); border: 1px solid var(--border);
    font-size: 10.5px; color: var(--ink-muted); flex: none;
  }
  .nav a:hover { background: var(--plane); color: var(--ink); }
  .nav a[aria-current="true"] {
    background: var(--plane); color: var(--ink); font-weight: 600;
    border-color: var(--border);
  }
  .nav a[aria-current="true"] .n {
    background: var(--series-matched); border-color: transparent; color: #fff;
  }

  .rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px 8px 0; border-top: 1px solid var(--border); }
  .rail-foot .sub { font-size: 11.5px; line-height: 1.45; word-break: break-word; }

  /* Below the breakpoint the rail lies down across the top and the nav scrolls
     sideways, rather than eating a third of a phone screen. */
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .rail {
      position: static; height: auto; flex-direction: row; align-items: center; gap: 14px;
      flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--border); padding: 12px 18px;
    }
    .brand { padding: 0; }
    .nav { flex-direction: row; overflow-x: auto; flex: 1; }
    .nav a { white-space: nowrap; }
    .rail-foot { margin-top: 0; border-top: 0; padding: 0; flex-direction: row; align-items: center; gap: 10px; }
    .rail-foot .sub { display: none; }
    .wrap { padding: 0 18px 56px; }
  }

  /* --- page head ---------------------------------------------------------- */
  .page-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 18px; flex-wrap: wrap; padding: 26px 0 20px;
  }
  .page-head h1 { font-size: 27px; font-weight: 700; letter-spacing: -0.02em; }
  .page-head .sub { margin-top: 5px; max-width: 68ch; }
  .head-figs { display: flex; gap: 10px; flex-wrap: wrap; }
  .head-fig {
    border: 1px solid var(--border); border-radius: 9px; background: var(--surface);
    padding: 7px 13px; box-shadow: var(--elev);
  }
  .head-fig .k { font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
  .head-fig .v { font-size: 17px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; padding: 3px 9px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
    white-space: nowrap;
  }
  .badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--sev-low); flex: none; }
  .badge.on i { background: var(--good); }
  .badge.on i { box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }

  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--ink-muted); font-size: 13px; }
  .sub code { font-size: 12px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    box-shadow: var(--elev);
  }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 14px; color: var(--ink-2); letter-spacing: 0.01em; }

  /* Numbered eyebrows. The page is also the running order of the demo, and the
     numbers are what let someone say "section three" out loud while presenting. */
  .eyebrow {
    display: flex; align-items: center; gap: 9px;
    margin: 26px 0 10px; color: var(--ink-muted);
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .eyebrow .num {
    display: grid; place-items: center; width: 19px; height: 19px; border-radius: 5px;
    background: var(--plane); border: 1px solid var(--border);
    color: var(--ink-2); font-size: 11px; letter-spacing: 0; flex: none;
  }
  .eyebrow .rule { flex: 1; height: 1px; background: var(--border); }
  .eyebrow, .brief { scroll-margin-top: 18px; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  .grid { display: grid; gap: 14px; margin-top: 20px; }
  /* Stretch, not start: two cards side by side that end at different heights read
     as a layout bug, and the short one having room to breathe costs nothing. */
  .cols-2 { grid-template-columns: minmax(0,1fr) minmax(0,1fr); align-items: stretch; }
  @media (max-width: 860px) { .cols-2 { grid-template-columns: 1fr; } }

  /* --- hero + donut + meter ---------------------------------------------- */
  .hero-row { display: grid; grid-template-columns: auto auto minmax(0,1fr); gap: 30px; align-items: center; }
  @media (max-width: 900px) { .hero-row { grid-template-columns: auto minmax(0,1fr); } }
  @media (max-width: 700px) { .hero-row { grid-template-columns: 1fr; gap: 22px; } }
  .hero-figure { font-size: 54px; font-weight: 650; line-height: 1; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
  .hero-label { color: var(--ink-2); font-size: 13px; margin-top: 7px; }
  .hero-rule { align-self: stretch; width: 1px; background: var(--border); }

  /* Donut: two segments of one whole, separated by a surface-coloured gap so the
     boundary is a gap and not a colour change. Centre carries the count, the
     legend carries the words — identity is never on colour alone. */
  .donut { display: flex; align-items: center; gap: 16px; }
  .donut svg { display: block; flex: none; }
  .donut .seg { transition: opacity .12s ease; }
  .donut svg:hover .seg { opacity: 0.45; }
  .donut svg .seg:hover { opacity: 1; }
  .donut-mid { font-size: 15px; font-weight: 650; fill: var(--ink); }
  .donut-sub { font-size: 8.5px; fill: var(--ink-muted); letter-spacing: 0.04em; }
  .legend { display: flex; flex-direction: column; gap: 9px; }
  .legend-row { display: flex; align-items: baseline; gap: 8px; font-size: 13px; white-space: nowrap; }
  .legend-row .sw { width: 9px; height: 9px; border-radius: 3px; flex: none; transform: translateY(1px); }
  .legend-row .lv { font-weight: 650; font-variant-numeric: tabular-nums; }
  .legend-row .ll { color: var(--ink-2); }

  /* Meter: a single ratio against its whole, on a same-hue track. */
  .meter { width: 100%; height: 14px; border-radius: 7px; background: var(--meter-track); overflow: hidden; }
  .meter > i { display: block; height: 100%; background: var(--meter-fill); border-radius: 7px; }
  .meter-legend { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 13px; }
  .meter-legend b { font-weight: 600; }
  .meter-legend .muted { color: var(--ink-2); }

  /* --- KPI row ----------------------------------------------------------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 18px; }
  /* Tiles sit inside a card, so they drop the card's shadow and take a flat
     inset plane instead — two stacked elevations would fight each other. */
  .tile { background: var(--plane); box-shadow: none; padding: 13px 15px; border-radius: 9px; }
  .tile .k { color: var(--ink-2); font-size: 12px; }
  .tile .v { font-size: 25px; font-weight: 650; margin-top: 5px; letter-spacing: -0.015em; font-variant-numeric: tabular-nums; }
  .tile .n { color: var(--ink-muted); font-size: 12px; margin-top: 3px; }
  /* Inside a half-width card, auto-fit lands on three across and orphans the
     fourth. Four accuracy measures are a 2x2 block, so say so. */
  .cols-2 .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  /* --- reason bars ------------------------------------------------------- */
  .bars { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 168px minmax(0,1fr) 34px; gap: 12px; align-items: center; }
  .bar-row .lbl { color: var(--ink-2); font-size: 13px; }
  .bar-track { height: 12px; background: var(--grid); border-radius: 6px; }
  /* Rounded data-end, anchored to the baseline at the left. */
  .bar-track > i { display: block; height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 3px; }
  .bar-row .n { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }

  /* --- table ------------------------------------------------------------- */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12px;
    padding: 0 10px 8px; border-bottom: 1px solid var(--axis); white-space: nowrap;
  }
  td { padding: 11px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background .1s ease; }
  tbody tr:hover td { background: var(--plane); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

  /* Status never rides on color alone — dot plus the word. */
  .sev { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .sev i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .sev-high i { background: var(--sev-high); }
  .sev-medium i { background: var(--sev-medium); }
  .sev-low i { background: var(--sev-low); }

  .reason {
    display: inline-block; padding: 2px 8px; border-radius: 5px;
    background: var(--plane); border: 1px solid var(--border);
    font-size: 12px; color: var(--ink-2); white-space: nowrap;
  }
  .note { color: var(--ink); }
  .note .action { color: var(--ink-2); margin-top: 4px; display: block; }
  .src { color: var(--ink-muted); font-size: 11px; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  button {
    font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); cursor: pointer;
  }
  button[aria-pressed="true"] { color: var(--ink); border-color: var(--axis); font-weight: 600; }
  button:hover { border-color: var(--axis); }

  .audit { max-height: 340px; overflow: auto; font-size: 12px; }
  .audit table { font-size: 12px; }
  .audit td { padding: 6px 10px; }

  .empty { color: var(--ink-muted); padding: 24px 0; }
  .err { color: var(--sev-high); }
  .scroll-x { overflow-x: auto; }

  /* --- month-end brief ---------------------------------------------------- */
  .brief { margin-bottom: 14px; }
  .brief .headline { font-size: 19px; font-weight: 600; line-height: 1.35; letter-spacing: -0.01em; margin: 0 0 8px; }
  .brief .state { color: var(--ink-2); margin: 0 0 16px; max-width: 76ch; }
  .attention { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 11px; }
  .attention li { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 12px; align-items: start; }
  @media (max-width: 620px) { .attention li { grid-template-columns: 1fr; gap: 3px; } }
  .attention .t { font-weight: 600; }
  .attention .d { color: var(--ink-2); }
  .risk {
    margin-top: 16px; padding: 11px 13px; border-radius: 8px;
    background: var(--plane); border: 1px solid var(--border);
    color: var(--ink-2); font-size: 13px;
  }
  .risk b { color: var(--ink); font-weight: 600; }

  /* --- ask panel ---------------------------------------------------------- */
  /* The ask panel is the part of this page a person actually talks to, so it is
     the one card that carries an accent edge. */
  .ask-card { border-left: 3px solid var(--series-matched); }
  .ask-form { display: flex; gap: 8px; margin-bottom: 12px; }
  .ask-form input {
    flex: 1; min-width: 0; font: inherit; font-size: 14.5px; padding: 11px 14px;
    border-radius: 9px; border: 1px solid var(--border);
    background: var(--plane); color: var(--ink);
  }
  .ask-form input::placeholder { color: var(--ink-muted); }
  .ask-form input:focus { outline: 2px solid var(--meter-fill); outline-offset: -1px; border-color: transparent; }
  .ask-form button {
    padding: 11px 20px; font-weight: 650; border-radius: 9px;
    background: var(--series-matched); border-color: transparent; color: #fff;
  }
  .ask-form button:hover:not(:disabled) { filter: brightness(1.08); border-color: transparent; }
  .ask-form button:disabled { opacity: 0.55; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .chips button { font-size: 12px; padding: 4px 10px; border-radius: 20px; }
  .thread { display: flex; flex-direction: column; gap: 16px; }
  .msg-q { font-weight: 600; }
  .msg-q::before { content: "› "; color: var(--ink-muted); }
  .msg-a { color: var(--ink); margin-top: 7px; }
  .msg-a p { margin: 0 0 9px; }
  .msg-a ul { margin: 0 0 9px; padding-left: 20px; }
  .msg-a li { margin-bottom: 3px; }
  .msg-a code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--plane); padding: 1px 5px; border-radius: 4px; }
  .msg-a > :last-child { margin-bottom: 0; }
  details.trace { margin-top: 9px; font-size: 12px; }
  details.trace summary { color: var(--ink-muted); cursor: pointer; }
  details.trace ol { margin: 8px 0 0; padding-left: 22px; color: var(--ink-2); }
  details.trace li { margin-bottom: 3px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .thinking { color: var(--ink-muted); }
  .thinking::after { content: "…"; animation: dots 1.2s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" role="img" aria-label="Recon">
        <rect width="34" height="34" rx="9" fill="var(--plane)" stroke="var(--border)"/>
        <!-- The join operator: two sides brought to a single point. -->
        <path d="M8 9 L15.4 17 L8 25 Z" fill="var(--series-matched)"/>
        <path d="M26 9 L18.6 17 L26 25 Z" fill="var(--series-flagged)"/>
      </svg>
      <span class="wordmark"><b>RECON</b><em>Reconciliation agent</em></span>
    </div>

    <nav class="nav" id="nav">
      <a href="#sec-brief"><span class="n">·</span>Month-end brief</a>
      <a href="#sec-overview"><span class="n">1</span>What the run found</a>
      <a href="#sec-ask"><span class="n">2</span>Ask the data</a>
      <a href="#sec-why"><span class="n">3</span>Why records flagged</a>
      <a href="#sec-benchmark"><span class="n">4</span>The alternatives</a>
      <a href="#sec-records"><span class="n">5</span>Every decision</a>
    </nav>

    <div class="rail-foot">
      <span class="badge" id="agentBadge"><i></i>checking…</span>
      <span class="sub" id="datasetLine">loading…</span>
    </div>
  </aside>

  <div class="wrap">
    <div class="page-head">
      <div>
        <h1>Reconciliation report</h1>
        <p class="sub">Three-way match across a merchant ledger, Razorpay payments and settlements, and a bank statement.</p>
      </div>
      <div class="head-figs" id="headFigs"></div>
    </div>

    <div id="app"><p class="empty">Loading…</p></div>
  </div>
</div>

<script type="module">
const RUPEE = 100;
const fmtRs = (paise) => {
  if (typeof paise !== 'number') return '—';
  const sign = paise < 0 ? '-' : '';
  const abs = Math.abs(paise);
  const whole = Math.floor(abs / RUPEE).toLocaleString('en-IN');
  return `${sign}₹${whole}.${String(abs % RUPEE).padStart(2, '0')}`;
};
const pct = (n) => `${(n * 100).toFixed(1)}%`;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const REASON_LABEL = {
  amount_mismatch: 'Amount mismatch',
  missing_counterpart: 'Missing counterpart',
  duplicate_utr: 'Duplicate UTR',
  date_out_of_window: 'Settled outside window',
  ambiguous_candidates: 'Ambiguous — multiple matches',
  unresolved: 'Unresolved',
};

const get = async (path) => {
  const res = await fetch(path);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error ?? res.statusText);
  return body;
};

let state = { summary: null, exceptions: [], audit: null, filter: 'all', thread: [], draft: '', asking: false };

async function load() {
  const app = document.getElementById('app');
  try {
    const [summary, exceptions, audit] = await Promise.all([
      get('/api/summary'), get('/api/exceptions'), get('/api/audit?limit=120'),
    ]);
    state = { ...state, summary, exceptions, audit };
    render();
  } catch (err) {
    app.innerHTML = `<div class="card"><p class="err">${esc(err.message)}</p></div>`;
  }
}

function render() {
  const { summary: s, exceptions } = state;
  const sum = s.summary;
  const totalValue = sum.value_matched_paise + sum.value_flagged_paise;
  const valueShare = totalValue ? sum.value_matched_paise / totalValue : 0;

  document.getElementById('datasetLine').innerHTML =
    `<code>${esc(s.dataset?.dir?.split('/').slice(-2).join('/') ?? '')}</code> · run ${esc(new Date(s.finished_at).toLocaleString())}`;

  // Which model is answering, in the one place that never scrolls away. During a
  // demo this is the difference between "it is thinking" and "it is off".
  const badge = document.getElementById('agentBadge');
  const on = s.agent?.available !== false;
  badge.className = `badge${on ? ' on' : ''}`;
  badge.innerHTML = `<i></i>${on ? esc((s.agent?.providers ?? 'model').split(' -> ')[0]) : 'no model key — templates only'}`;

  // The three figures a merchant would want before reading anything else, kept
  // beside the title rather than buried in the card grid.
  document.getElementById('headFigs').innerHTML = [
    ['Reconciled', pct(sum.match_rate)],
    ['Needs review', String(sum.exceptions)],
    ['Value flagged', fmtRs(sum.value_flagged_paise)],
  ].map(([k, v]) => `<div class="head-fig"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');

  document.getElementById('app').innerHTML = `
    ${briefCard(s.brief)}
    ${eyebrow(1, 'What the run found', 'sec-overview')}
    <section class="card">
      <div class="hero-row">
        ${heroFigure(s, sum)}
        <div class="hero-rule" aria-hidden="true"></div>
        ${donut(sum.matched, sum.ledger_rows - sum.matched)}
      </div>

      <div style="margin-top:22px">
        <h2>Value confirmed in the bank</h2>
        <div class="meter" role="img"
             aria-label="${pct(valueShare)} of invoiced value auto-reconciled">
          <i style="width:${(valueShare * 100).toFixed(2)}%"></i>
        </div>
        <div class="meter-legend">
          <span><b>${fmtRs(sum.value_matched_paise)}</b> reconciled</span>
          <span class="muted"><b>${fmtRs(sum.value_flagged_paise)}</b> flagged for review</span>
        </div>
      </div>

      <div class="kpis">
        ${tile('Settlement batches', `${sum.settlements_matched}/${sum.settlement_groups}`, 'confirmed against the bank')}
        ${tile('Bank credits flagged', `${sum.bank_exceptions}/${sum.bank_rows}`, `${fmtRs(sum.bank_unexplained_credit_paise)} unexplained`)}
        ${tile('Invoice exceptions', String(sum.exceptions), 'every one carries a reason code')}
        ${tile('Throughput', s.throughput ? `${s.throughput.records_per_second.toLocaleString('en-IN')}/s` : '—',
               s.throughput ? `${s.throughput.records} records in ${s.throughput.elapsed_ms}ms` : '')}
      </div>
    </section>

    ${eyebrow(2, 'Ask it anything about this run', 'sec-ask')}
    ${askCard(s.agent)}

    ${eyebrow(3, 'Why those records were flagged', 'sec-why')}
    <div class="grid cols-2" style="margin-top:0">
      <section class="card">
        <h2>Exceptions by reason</h2>
        ${reasonBars(sum.exceptions_by_reason)}
      </section>
      <section class="card">
        <h2>How the matches were made</h2>
        ${accuracyPanel(s)}
      </section>
    </div>

    ${s.compare?.systems ? eyebrow(4, 'Measured against the alternatives', 'sec-benchmark') : ''}
    ${comparePanel(s.compare)}

    ${eyebrow(5, 'Every record, and every decision behind it', 'sec-records')}
    <section class="card">
      <h2>Exception list — every unmatched record, nothing hidden</h2>
      <div class="toolbar">
        ${['all', 'high', 'medium', 'low'].map((f) =>
          `<button data-filter="${f}" aria-pressed="${state.filter === f}">${f === 'all' ? `All (${exceptions.length})` : f[0].toUpperCase() + f.slice(1)}</button>`).join('')}
      </div>
      <div class="scroll-x">${exceptionTable()}</div>
    </section>

    <section class="card" style="margin-top:14px">
      <h2>Audit trail — last ${state.audit.entries.length} of ${state.audit.total} decisions</h2>
      <div class="audit scroll-x">${auditTable()}</div>
    </section>
  `;

  for (const btn of document.querySelectorAll('[data-filter]')) {
    btn.addEventListener('click', () => { state.filter = btn.dataset.filter; render(); });
  }
  wireAsk();
  wireNav();
}

const tile = (k, v, n) => `<div class="card tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="n">${esc(n)}</div></div>`;

/**
 * Keeps the rail pointing at whatever is on screen.
 *
 * This was first written with an IntersectionObserver watching the section
 * headings inside a narrow band, which is the usual recipe and is wrong here.
 * The headings are a few pixels tall and the sections between them are hundreds,
 * so scrolling through the middle of the exception table left the band empty,
 * nothing was intersecting, and the rail snapped back to the first item. The
 * position of the last heading you scrolled past is the actual question being
 * asked, so it is now asked directly.
 *
 * Rebuilt on every render, because render() replaces the section nodes wholesale
 * and listeners left pointing at the old ones would keep working against
 * detached elements.
 */
let navCleanup = null;
function wireNav() {
  navCleanup?.();
  const targets = [...document.querySelectorAll('#nav a')]
    .map((a) => ({ a, el: document.getElementById(a.getAttribute('href').slice(1)) }))
    .filter((t) => t.el);
  if (!targets.length) return;

  let frame = 0;
  const mark = () => {
    frame = 0;
    const line = window.innerHeight * 0.22;
    const doc = document.documentElement;
    // At the foot of the document the last section is what is on screen, even
    // though its heading crossed the line a long way back.
    const atEnd = window.innerHeight + window.scrollY >= doc.scrollHeight - 2;

    // Walk forward and keep the last heading that has passed the line. Positions
    // are read fresh rather than cached: the exception table changes height when
    // a severity filter is applied, and cached offsets would then be wrong with
    // no scroll event to correct them.
    let current = targets[0];
    if (atEnd) current = targets[targets.length - 1];
    else for (const t of targets) if (t.el.getBoundingClientRect().top <= line) current = t;

    for (const { a } of targets) a.removeAttribute('aria-current');
    current.a.setAttribute('aria-current', 'true');
  };

  const onScroll = () => { frame ||= requestAnimationFrame(mark); };
  // A hidden tab stops serving animation frames, so a scroll that lands while the
  // page is in the background leaves the throttle latched on a frame that will
  // never arrive, and every later scroll is dropped. Coming back into view clears
  // it and re-reads the position.
  const onShow = () => { if (frame) cancelAnimationFrame(frame); frame = 0; mark(); };

  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', onScroll, { passive: true });
  document.addEventListener('visibilitychange', onShow);

  navCleanup = () => {
    removeEventListener('scroll', onScroll);
    removeEventListener('resize', onScroll);
    document.removeEventListener('visibilitychange', onShow);
    if (frame) cancelAnimationFrame(frame);
    frame = 0;
  };
  mark();
}

const eyebrow = (n, label, id) =>
  `<div class="eyebrow"${id ? ` id="${id}"` : ''}><span class="num">${n}</span>${esc(label)}<span class="rule"></span></div>`;

/**
 * The single largest number on the page.
 *
 * It used to be the match rate, which quietly argued against the project. This
 * whole build exists to say that a match rate on its own rewards guessing — the
 * naive baseline beats Recon on it by declaring money reconciled that never
 * arrived — so putting 69.4% in 54px type invited the one reading the rest of
 * the page spends its time refuting.
 *
 * Precision leads instead: of everything it settled on its own, how much was
 * right. The match rate is not hidden — it is a line below, in the donut, and in
 * the header figures — because burying it would be the same dishonesty in the
 * other direction. Where there is no labelled ground truth to measure precision
 * against, the match rate leads again, since it is then the only thing measured.
 */
function heroFigure(s, sum) {
  const m = s.metrics?.accuracy;
  if (!m) {
    return `<div>
      <div class="hero-figure">${pct(sum.match_rate)}</div>
      <div class="hero-label">${sum.matched} of ${sum.ledger_rows} invoices<br>auto-reconciled end to end</div>
    </div>`;
  }
  const wrong = m.false_positive + m.misrouted_matches;
  return `<div>
    <div class="hero-figure">${pct(m.precision_auto_matched)}</div>
    <div class="hero-label">
      of the ${sum.matched} invoices it settled on its own were correct —
      <b>${wrong === 0 ? 'none' : wrong}</b> booked to the wrong invoice.<br>
      ${pct(sum.match_rate)} auto-reconciled; the rest is on the exception list with a reason.
    </div>
  </div>`;
}

/**
 * Matched against flagged, as one whole.
 *
 * A donut is only defensible for a part-to-whole with very few parts, which is
 * exactly what this is: an invoice either cleared all three legs or it did not.
 * The two arcs are separated by a surface-coloured gap rather than by colour
 * alone, the counts are written directly beside their swatches, and the centre
 * carries the total — so the figure survives being printed, read by someone with
 * a colour vision deficiency, or squinted at from the back of a room.
 */
function donut(matched, flagged) {
  const total = matched + flagged;
  if (!total) return '<div></div>';

  const R = 42, STROKE = 15, C = 2 * Math.PI * R, GAP = 5;
  const share = matched / total;
  // Each arc is shortened by the gap so the two ends never touch.
  const matchedLen = Math.max(0, share * C - GAP);
  const flaggedLen = Math.max(0, (1 - share) * C - GAP);

  const arc = (len, offset, color, label, n) => `
    <circle class="seg" cx="55" cy="55" r="${R}" fill="none"
            stroke="${color}" stroke-width="${STROKE}" stroke-linecap="butt"
            stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}"
            stroke-dashoffset="${offset.toFixed(2)}"
            transform="rotate(-90 55 55)"><title>${label}: ${n} of ${total}</title></circle>`;

  return `<div class="donut">
    <svg width="110" height="110" viewBox="0 0 110 110" role="img"
         aria-label="${matched} of ${total} invoices reconciled, ${flagged} flagged">
      ${arc(matchedLen, -GAP / 2, 'var(--series-matched)', 'Reconciled', matched)}
      ${arc(flaggedLen, -(share * C + GAP / 2), 'var(--series-flagged)', 'Flagged', flagged)}
      <text class="donut-mid" x="55" y="53" text-anchor="middle">${total}</text>
      <text class="donut-sub" x="55" y="66" text-anchor="middle">INVOICES</text>
    </svg>
    <div class="legend">
      <div class="legend-row">
        <span class="sw" style="background:var(--series-matched)"></span>
        <span class="lv">${matched}</span><span class="ll">reconciled</span>
      </div>
      <div class="legend-row">
        <span class="sw" style="background:var(--series-flagged)"></span>
        <span class="lv">${flagged}</span><span class="ll">flagged for review</span>
      </div>
    </div>
  </div>`;
}

const writtenBy = (source, model) =>
  source === 'llm' ? `written by ${esc(model ?? 'model')}` : 'deterministic template';

/** The brief the merchant reads before anything else. */
function briefCard(brief) {
  if (!brief) return '';
  const items = (brief.needs_attention ?? []).map((i) => {
    const sev = ['high', 'medium', 'low'].includes(i.severity) ? i.severity : 'low';
    return `<li>
      <span class="sev sev-${sev}"><i></i>${sev[0].toUpperCase() + sev.slice(1)}</span>
      <span><span class="t">${esc(i.title)}</span><br><span class="d">${esc(i.detail)}</span></span>
    </li>`;
  }).join('');

  return `<section class="card brief" id="sec-brief">
    <h2>Month-end brief · <span class="src">${writtenBy(brief.source, brief.model)}</span></h2>
    <p class="headline">${esc(brief.headline)}</p>
    <p class="state">${esc(brief.state_of_the_month)}</p>
    ${items ? `<ul class="attention">${items}</ul>` : ''}
    ${brief.biggest_single_risk ? `<p class="risk"><b>Biggest single risk</b> — ${esc(brief.biggest_single_risk)}</p>` : ''}
  </section>`;
}

const SUGGESTED = [
  'How much money is stuck, and who do I chase first?',
  'Why is the largest flagged invoice flagged?',
  'Which payouts did the bank not confirm?',
  'Show me every duplicate credit.',
  'How much unexplained money arrived in the bank?',
];

/**
 * The ask panel. The tool trace ships with every answer rather than behind a
 * debug flag: an answer a model wrote about money is only worth as much as the
 * records it is provably built from.
 */
function askCard(agent) {
  const thread = state.thread.map((m) => `
    <div>
      <div class="msg-q">${esc(m.q)}</div>
      ${m.pending
        ? '<div class="msg-a thinking"><span class="thinking">reading the reconciliation</span></div>'
        : m.error
          ? `<div class="msg-a err">${esc(m.error)}</div>`
          : `<div class="msg-a">${markdownLite(m.a)}</div>${traceBlock(m)}`}
    </div>`).join('');

  const off = agent && agent.available === false;
  return `<section class="card ask-card">
    <h2>Ask the reconciliation</h2>
    ${off
      ? `<p class="sub" style="margin:0">Put a free <code>GEMINI_API_KEY</code> or <code>GROQ_API_KEY</code> in <code>.env</code>
           (or a paid <code>ANTHROPIC_API_KEY</code>) and restart the server to enable this.
           Matching, the exception list and the audit trail all work without it.</p>`
      : `<form class="ask-form" id="askForm">
           <input id="askInput" name="q" autocomplete="off" placeholder="Ask about any invoice, payout or reason code…"
                  value="${esc(state.draft)}" ${state.asking ? 'disabled' : ''}>
           <button type="submit" ${state.asking ? 'disabled' : ''}>${state.asking ? 'Asking…' : 'Ask'}</button>
         </form>
         <div class="chips">${SUGGESTED.map((q) => `<button type="button" data-ask="${esc(q)}" ${state.asking ? 'disabled' : ''}>${esc(q)}</button>`).join('')}</div>
         ${thread ? `<div class="thread">${thread}</div>` : `<p class="sub" style="margin:0">
            Answers are built by calling read-only tools over this run — ${esc((agent?.tools ?? []).length)} of them.
            The agent can read every decision the engine made. It cannot make one.</p>`}`}
  </section>`;
}

function traceBlock(m) {
  if (!m.trace?.length) return '';
  const calls = m.trace.map((t) => {
    const args = Object.entries(t.input ?? {}).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(', ');
    return `<li>${esc(t.tool)}(${esc(args)})${t.rows !== null && t.rows !== undefined ? ` → ${t.rows} rows` : ''}</li>`;
  }).join('');
  return `<details class="trace">
    <summary>${m.trace.length} tool call${m.trace.length === 1 ? '' : 's'} · ${m.elapsed_ms}ms · ${m.usage?.cache_read_input_tokens ?? 0} cached tokens</summary>
    <ol>${calls}</ol>
  </details>`;
}

/**
 * Just enough markdown for what the agent is told to write: paragraphs, bullets,
 * bold and inline code. Escaping happens first and the replacements only ever
 * introduce tags from this fixed set, so the model's text can never become markup.
 */
function markdownLite(text) {
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');

  return String(text ?? '').split(/\n{2,}/).map((block) => {
    const lines = block.split('\n').filter((l) => l.trim());
    if (lines.length && lines.every((l) => /^\s*[-*]\s+/.test(l))) {
      return `<ul>${lines.map((l) => `<li>${inline(l.replace(/^\s*[-*]\s+/, ''))}</li>`).join('')}</ul>`;
    }
    return `<p>${lines.map(inline).join('<br>')}</p>`;
  }).join('');
}

function wireAsk() {
  const form = document.getElementById('askForm');
  if (!form) return;
  const input = document.getElementById('askInput');

  input.addEventListener('input', () => { state.draft = input.value; });
  form.addEventListener('submit', (e) => { e.preventDefault(); submitQuestion(input.value); });
  for (const btn of document.querySelectorAll('[data-ask]')) {
    btn.addEventListener('click', () => submitQuestion(btn.dataset.ask));
  }
  if (state.focusAsk) { input.focus(); state.focusAsk = false; }
}

async function submitQuestion(question) {
  const q = String(question ?? '').trim();
  if (!q || state.asking) return;

  const entry = { q, pending: true };
  state.thread.push(entry);
  state.asking = true;
  state.draft = '';
  render();

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      // Prior turns go back so follow-ups like "and the one before it" resolve.
      body: JSON.stringify({
        question: q,
        history: state.thread.filter((m) => m.a).flatMap((m) => [
          { role: 'user', content: m.q }, { role: 'assistant', content: m.a },
        ]),
      }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error ?? res.statusText);
    Object.assign(entry, { pending: false, a: body.answer, trace: body.trace, usage: body.usage, elapsed_ms: body.elapsed_ms });
  } catch (err) {
    Object.assign(entry, { pending: false, error: err.message });
  } finally {
    state.asking = false;
    state.focusAsk = true;
    render();
  }
}

/** Horizontal bars: one hue, magnitude by length, counts direct-labelled. */
function reasonBars(byReason) {
  const rows = Object.entries(byReason).sort((a, b) => b[1] - a[1]);
  if (!rows.length) return '<p class="empty">No exceptions.</p>';
  const max = Math.max(...rows.map((r) => r[1]));
  return `<div class="bars">${rows.map(([reason, count]) => `
    <div class="bar-row">
      <span class="lbl">${esc(REASON_LABEL[reason] ?? reason)}</span>
      <span class="bar-track"><i style="width:${(count / max * 100).toFixed(1)}%"
        title="${esc(REASON_LABEL[reason] ?? reason)}: ${count}"></i></span>
      <span class="n">${count}</span>
    </div>`).join('')}</div>`;
}

function accuracyPanel(s) {
  const m = s.metrics?.accuracy;
  const w = s.calibrated_ledger_window;
  const rules = s.metrics?.matches_by_rule ?? null;
  const parts = [];

  if (m) {
    parts.push(`<div class="kpis" style="margin-top:0">
      ${tile('Precision', pct(m.precision_auto_matched), `${m.false_positive} false positive${m.false_positive === 1 ? '' : 's'}`)}
      ${tile('Recall', pct(m.recall), `${m.false_negative} missed`)}
      ${tile('Misrouted', String(m.misrouted_matches), 'booked to the wrong invoice')}
      ${tile('Reason accuracy', pct(m.reason_code_accuracy), 'correct code on flagged rows')}
    </div>`);
  } else {
    parts.push(`<p class="sub" style="margin:0 0 10px">No labelled ground truth for this dataset — accuracy is only measurable on a generated set.</p>`);
  }
  if (w) {
    parts.push(`<p class="sub" style="margin:12px 0 0">Payment-date window calibrated from this merchant's own reference-matched invoices:
      <b>${w.min} to +${w.max} days</b>.</p>`);
  }
  if (rules) {
    parts.push(`<p class="sub" style="margin:8px 0 0">${Object.entries(rules)
      .map(([rule, n]) => `${n} by <code>${esc(rule)}</code>`).join(' · ')}</p>`);
  }
  return parts.join('');
}

/**
 * Recon against the two things a merchant would plausibly have instead, on this
 * same data. The row that matters is the naive one: a higher match rate and real
 * money booked to the wrong place. Rendered as a table, not a chart — three rows
 * of five measures is a table, and drawing it would only make it slower to read.
 */
function comparePanel(compare) {
  if (!compare?.systems) return '';
  const rows = Object.entries(compare.systems).map(([key, sys]) => {
    const wrong = sys.value_wrongly_declared_reconciled_paise;
    return `<tr>
      <td><b>${esc(key)}</b><br><span class="src">${esc(sys.label)}</span></td>
      <td class="num">${pct(sys.match_rate)}</td>
      <td class="num">${pct(sys.precision_auto_matched)}</td>
      <td class="num">${pct(sys.bank_row_accuracy)}</td>
      <td class="num">${sys.total_misrouted_matches}</td>
      <td class="num">${wrong > 0
        ? `<span class="sev sev-high"><i></i>${fmtRs(wrong)}</span>`
        : `<span class="sev sev-low"><i></i>${fmtRs(0)}</span>`}</td>
    </tr>`;
  }).join('');

  const naive = compare.systems.single_leg;
  const recon = compare.systems.recon;
  const punchline = naive && recon && naive.match_rate > recon.match_rate
    ? `<p class="risk" style="margin-top:14px"><b>Read the first two columns together.</b>
       The naive build reports a <b>higher</b> match rate than Recon
       (${pct(naive.match_rate)} vs ${pct(recon.match_rate)}) and declares
       <b>${fmtRs(naive.value_wrongly_declared_reconciled_paise)}</b> reconciled that ground truth says was not.
       A headline match rate, on its own, rewards exactly the wrong behaviour.</p>`
    : '';

  // A baseline that scores exactly zero looks rigged, and the reason it is not
  // rigged lived only in a source comment. Anyone reading the table deserves the
  // mechanism on the same screen as the number.
  const sheet = compare.systems.spreadsheet;
  const zeroNote = sheet && sheet.match_rate === 0
    ? `<p class="sub" style="margin:12px 0 0">The spreadsheet scores zero because a VLOOKUP has nothing to look up:
       Razorpay deducts a fee plus GST and batches a day of payments into a single payout, so an invoice
       amount is not a number that ever appears in the bank statement. Its 100% precision is over an empty
       set — it matched nothing, so it got nothing wrong, which is why precision is never quoted here without
       a match rate beside it.</p>`
    : '';

  // One dataset is "this same data"; forty generated ones are a holdout, and
  // calling those "this same data" would be a false claim about the strongest
  // evidence in the project.
  const scope = compare.datasets > 1
    ? `What the alternatives score across ${compare.datasets} unseen datasets`
    : 'What the alternatives score on this same data';

  return `<section class="card" style="margin-top:14px">
    <h2>${esc(scope)} · <span class="src">${esc(compare.profile ?? '')} profile</span></h2>
    <div class="scroll-x"><table>
      <thead><tr>
        <th>System</th><th class="num">Match rate</th><th class="num">Precision</th>
        <th class="num">Bank rows</th><th class="num">Misrouted</th><th class="num">Wrongly reconciled</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${punchline}
    ${zeroNote}
  </section>`;
}

function exceptionTable() {
  const rows = state.exceptions.filter((e) => state.filter === 'all' || e.note?.severity === state.filter);
  if (!rows.length) return '<p class="empty">Nothing in this bucket.</p>';
  return `<table>
    <thead><tr>
      <th>Severity</th><th>Record</th><th>Date</th><th class="num">Amount</th>
      <th>Reason</th><th>What is wrong, and what to do</th>
    </tr></thead>
    <tbody>${rows.map((e) => {
      const sev = e.note?.severity ?? 'low';
      return `<tr>
        <td><span class="sev sev-${esc(sev)}"><i></i>${sev[0].toUpperCase() + sev.slice(1)}</span></td>
        <td><span class="mono">${esc(e.id)}</span><br><span class="src">${esc(e.counterparty ?? '').slice(0, 42)}</span></td>
        <td class="num">${esc(e.date)}</td>
        <td class="num">${fmtRs(e.amount_paise)}</td>
        <td><span class="reason">${esc(REASON_LABEL[e.reason] ?? e.reason)}</span></td>
        <td class="note">${e.note
          ? `${esc(e.note.explanation)}<span class="action">→ ${esc(e.note.suggested_action)}</span>
             <span class="src">${e.note.source === 'llm' ? `written by ${esc(e.note.model ?? 'model')}` : 'deterministic template'}</span>`
          : '<span class="src">run <code>npm run explain</code> to generate a note</span>'}</td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

function auditTable() {
  const entries = [...state.audit.entries].reverse();
  if (!entries.length) return '<p class="empty">No audit entries yet.</p>';
  return `<table>
    <thead><tr><th>#</th><th>Leg</th><th>Subject</th><th>Decision</th><th>Rule / reason</th><th class="num">Confidence</th><th>At</th></tr></thead>
    <tbody>${entries.map((e) => `<tr>
      <td class="num">${e.seq ?? '—'}</td>
      <td>${esc(e.leg)}</td>
      <td><span class="mono">${esc(e.subject_id)}</span><br><span class="src">${esc(e.subject)}</span></td>
      <td>${esc(e.decision)}</td>
      <td class="mono">${esc(e.rule ?? e.reason ?? '—')}</td>
      <td class="num">${typeof e.confidence === 'number' ? e.confidence.toFixed(2) : '—'}</td>
      <td class="src">${esc(new Date(e.at).toLocaleTimeString())}</td>
    </tr>`).join('')}</tbody></table>`;
}

load();
</script>
</body>
</html>
